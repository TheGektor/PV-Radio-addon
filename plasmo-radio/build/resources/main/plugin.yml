name: PlasmoRadio
main: com.example.plasmoradio.PlasmoRadioPlugin
version: 1.0.0
api-version: '1.20'
author: You
commands:
  plasmo-radio:
    description: Admin commands for PlasmoRadio
    usage: /plasmo-radio <create|delete|setwave|mode>
    permission: plasmo.radio.admin
permissions:
  plasmo.radio.use:
    default: true
  plasmo.radio.broadcast:
    default: true
  plasmo.radio.listen:
    default: true
  plasmo.radio.admin:
    default: op
